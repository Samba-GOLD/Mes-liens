<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: linear-gradient(135deg, #fceff9, #e0f7fa);
      --white: #fff;
      --text: #2d2d2d;
      --accent: #7e57c2;
      --whatsapp: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--white);
      border-radius: 24px;
      padding: 40px 30px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    .profile-photo {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 4px #fff, 0 4px 20px rgba(0,0,0,0.2);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--text);
    }

    .status {
      font-size: 1rem;
      color: #666;
      margin-top: 8px;
    }

    .desc {
      margin: 20px 0;
      font-size: 0.95rem;
      color: #555;
      margin: 20px 0;
      font-size: 0.95rem;
      color: #555;
      background-color: #a5bbc454;
      padding: 20px;
      border-radius: 16px;
      text-align: justify;
      line-height: 1.6;
      font-weight: 300;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      color: var(--text);
      background-color: #f3f4f6;
      transition: all 0.3s ease;
    }

    .links a i {
      margin-right: 10px;
      font-size: 1.2rem;
    }

    .links a:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }

    .whatsapp {
      animation: pulse 1.2s infinite;
      background-color: var(--whatsapp);
      color: rgba(22, 194, 85, 0.795) !important;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6); }
      70% { box-shadow: 0 0 0 10px rgba(37, 211, 102, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
    }

    @media screen and (max-width: 500px) {
      .card {
        padding: 30px 20px;
      }
      .profile-photo {
        width: 120px;
        height: 120px;
      }
      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

    <h1>Samba <strong>SECK</strong></h1>

    <p class="desc">Je vous accompagne dans la création de votre visibilité digitale, de votre stratégie à vos contenus. Let’s level up ! 🚀</p>

      <a href="mailto:sambaseck1322@gmail.com"><i class="fas fa-envelope"></i>Email</a>
      <a href="https://wa.me/+221760196541" class="whatsapp" target="_blank"><i class="fab fa-whatsapp"></i>WhatsApp</a>
      <a href="tel:+221760196541"><i class="fas fa-phone"></i>Appel direct</a>
    </div>
  </div>
</body>
</html>
